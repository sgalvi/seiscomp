[supervisord]
nodaemon=true
user=root

[program:xvnc]
command=Xtigervnc :1 -geometry 1600x900 -depth 24 -SecurityTypes None -localhost yes -AlwaysShared
user=seiscomp
priority=10
autorestart=true

[program:openbox]
command=openbox
environment=DISPLAY=":1",HOME="/home/seiscomp"
user=seiscomp
priority=20
startsecs=3
autorestart=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5901
priority=30
autorestart=true

[program:scolv]
command=/home/seiscomp/seiscomp/bin/seiscomp exec scolv
environment=DISPLAY=":1",HOME="/home/seiscomp"
user=seiscomp
priority=40
startsecs=5
autorestart=true
